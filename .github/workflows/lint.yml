#
# Static analysis: does the script hold up, and is every file licensed. What
# `download.sh` actually *does* is checked separately, by the suite that
# `test.yml` runs.
#
# Actions are pinned to a commit SHA, not a tag. A tag is mutable: whoever can
# move it can change what runs here.
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; no job below asks for more.
permissions: read-all

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck download.sh

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  checksums:
    name: checksum files are well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every checksum parses and names a file we publish
        run: |
          set -euo pipefail
          fail=0
          for f in checksums/*/*.sha256; do
            while read -r sum name; do
              case "$sum" in
                [0-9a-f]*) [ ${#sum} -eq 64 ] || { echo "$f: not a sha256: $sum"; fail=1; } ;;
                *) echo "$f: malformed line: $sum $name"; fail=1 ;;
              esac
              case "$name" in
                basis|basis.exe) ;;
                *) echo "$f: unexpected file name: $name"; fail=1 ;;
              esac
            done < "$f"
          done
          exit $fail
