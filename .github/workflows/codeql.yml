#
# CodeQL over the GitHub Actions workflows themselves.
#
# There is no application code in this repository -- but there are workflows,
# and a workflow is code with credentials. CodeQL's `actions` support catches
# the failure modes that matter here: untrusted input reaching a run step,
# excessive permissions, and unpinned or cache-poisonable steps.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
