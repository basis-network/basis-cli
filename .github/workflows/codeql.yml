#
# CodeQL over the GitHub Actions workflows themselves.
#
# There is no application code in this repository -- but there are workflows,
# and a workflow is code with credentials. CodeQL's `actions` support catches
# the failure modes that matter here: untrusted input reaching a run step,
# excessive permissions, and unpinned or cache-poisonable steps.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:actions"
