#
# OpenSSF Scorecard. Publishes the result to the public dashboard so anyone can
# see how this repository scores without taking our word for it.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 1'
  push:
    branches: [main]
  # Some checks read the published release, not the tree, so a re-analysis is
  # sometimes needed without a commit to trigger it.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the result to the code-scanning dashboard.
      security-events: write
      # Publish to the OpenSSF REST API, which is what gives the public badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
