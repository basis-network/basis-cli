#
# This repository ships no code dependencies -- it is shell and metadata. What
# it does depend on is the set of GitHub Actions the workflows call, which are
# pinned to commit SHAs. Pinned means safe, not current: without something
# watching them, a pinned action quietly rots. This is that something.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # The codeql-action references -- init, analyze, upload-sarif -- have to
    # move together: `analyze` refuses a configuration written by an `init` of
    # another version. Split into one pull request each, two of the three fail
    # their own required check, which is what happened to #6/#7 and #21/#23.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
