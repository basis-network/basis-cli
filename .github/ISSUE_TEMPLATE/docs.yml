name: Documentation
description: Something here is wrong, missing or misleading
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File and section, or a link.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What it says, and what it should say. If it cost you time, say how — that is the part worth writing down.
    validations:
      required: true
