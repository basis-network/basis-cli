version = 1

SPDX-PackageName = "basis-cli"
SPDX-PackageSupplier = "Basis Network <contact@basisnetwork.com.co>"
SPDX-PackageDownloadLocation = "https://github.com/basis-network/basis-cli"

# Files that carry no comment syntax, or where a header would be noise for the
# reader (rendered documents, the licence texts themselves, checksum files).
# Everything with a comment syntax carries an SPDX header inline instead.

[[annotations]]
path = [
  "**.md",
  "LICENSE",
  "NOTICE",
  "checksums/**",
  ".github/ISSUE_TEMPLATE/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Basis Network"
SPDX-License-Identifier = "Apache-2.0"
